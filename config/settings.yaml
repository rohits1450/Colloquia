dataset:
  name: "roskoN/dailydialog"
  config: "full"
  split: "train"

embeddings:
  model: "BAAI/bge-m3"
  batch_size: 16
  device: "cpu"

qdrant:
  host: "localhost"
  port: 6333
  collection: "dailydialog_slang_kb"
  vector_size: 1024  # bge-m3 dimension

retrieval:
  top_k: 5
  score_threshold: 0.3

generation:
  model: "llama-3.3-70b-versatile"
  max_new_tokens: 256
  num_candidates: 4
  temperature_range: [0.3, 0.6, 0.8, 1.0]
  top_p: 0.9

dpo:
  model: "google/gemma-2-2b-it"
  output_dir: "./outputs/dpo-lora"
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  learning_rate: 5.0e-5
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_length: 512
  beta: 0.1

paths:
  data_dir: "./outputs"
  kb_metadata: "./outputs/kb_metadata.jsonl"
  candidates: "./outputs/candidates.jsonl"
  dpo_dataset: "./outputs/dpo_pairs.jsonl"
  sample_io: "./outputs/sample_input_output.txt"
  qdrant_storage: "./data/qdrant_storage"
